  Rotate the beam one full turn in any direction, then stabilize at zero.

assignmentTouch90Title: 'Touch the bottom'
assignmentTouch90DescriptionMd: |
  # Hit 90°
  Tilt to at least 90° once, then return to balance for 10 seconds.

assignmentTurn720Title: 'Double rotation'
assignmentTurn720DescriptionMd: |
  # Two complete turns
  Spin the beam twice before leveling out together.
